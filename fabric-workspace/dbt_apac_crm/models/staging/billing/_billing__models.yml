version: 2

models:
  - name: stg_billing__arias
    description: "Arias revenue records, type-cast with English column names. No filters applied -- HB team exclusion happens in int_billing__arias_enriched."
    columns:
      - name: PolicyNo
        description: "Arias policy identifier"
      - name: InvoiceNumber
        description: "Source 請求書番号 -- raw invoice number before ARIAS- prefix"
      - name: RecurringFlag
        description: "R/N flag driving BusinessType and RecurringRevenue derivation"
        tests:
          - accepted_values:
              values: ['R', 'N']
              quote: true
              config:
                severity: warn
