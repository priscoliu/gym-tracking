version: 2

models:
  - name: stg_crm_opportunity
    description: "One row per CRM opportunity from D365"
    columns:
      - name: OpportunityId
        tests:
          - unique
          - not_null
      - name: StatusCodeName
        tests:
          - not_null

  - name: stg_crm_opportunity_service
    description: "One row per opportunity service line"
    columns:
      - name: OpportunityServiceId
        tests:
          - unique
          - not_null
      - name: OpportunityId
        tests:
          - not_null

  - name: stg_crm_income_assignment
    description: "Colleague split records per service line"
    columns:
      - name: IncomeAssignmentId
        tests:
          - unique
          - not_null

  - name: stg_crm_account
    description: "Global D365 accounts"
    columns:
      - name: AccountId
        tests:
          - unique
          - not_null

  - name: stg_crm_systemuser
    description: "Active licensed D365 users"
    columns:
      - name: SystemUserId
        tests:
          - unique
          - not_null

  - name: stg_crm_office
    description: "D365 office reference"
    columns:
      - name: OfficeId
        tests:
          - unique
          - not_null

  - name: stg_crm_profitcenter
    description: "D365 profit center reference"
    columns:
      - name: ProfitCenterId
        tests:
          - unique
          - not_null

  - name: stg_crm_currency
    description: "D365 transaction currency"
    columns:
      - name: CurrencyId
        tests:
          - unique
          - not_null

  - name: stg_crm_productclass
    description: "D365 product class / LOB reference"
    columns:
      - name: ProductClassId
        tests:
          - unique
          - not_null

  - name: stg_crm_opportunity_tagslist
    description: "Raw opportunity-tag junction. TagName lookup is intermediate responsibility."
    columns:
      - name: OpportunityId
        tests:
          - not_null
      - name: TagId
        tests:
          - not_null

  - name: stg_crm_tagslist
    description: "All D365 tags (raw). Filter to APAC-relevant in intermediate layer."
    columns:
      - name: TagId
        tests:
          - unique
          - not_null

  - name: stg_crm_account_tagslist
    description: "Raw account-tag junction. Inheritance (Direct/Parent/Global Parent) is intermediate responsibility."
    columns:
      - name: AccountId
        tests:
          - not_null
      - name: TagId
        tests:
          - not_null

  - name: stg_crm_activity
    description: "D365 activities (open and completed)"
    columns:
      - name: ActivityId
        tests:
          - unique
          - not_null

  - name: stg_crm_lead
    description: "D365 leads (open and converted)"
    columns:
      - name: LeadId
        tests:
          - unique
          - not_null
