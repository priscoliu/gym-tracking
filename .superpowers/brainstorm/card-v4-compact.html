<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Summary Card — Compact</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Segoe UI, system-ui, -apple-system, sans-serif;
    background: #ECEEF1;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .page-label {
    font-size: 11px;
    font-weight: 500;
    color: #9CA3AF;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  /* ── canvas context hint ── */
  .canvas-hint {
    width: 640px;
    background: rgba(255,255,255,0.4);
    border: 1px dashed #C8CDD5;
    border-radius: 6px;
    padding: 20px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .canvas-label {
    font-size: 10px;
    color: #B0B8C4;
    letter-spacing: 0.5px;
    writing-mode: vertical-lr;
    text-transform: uppercase;
    transform: rotate(180deg);
    align-self: center;
  }
  .canvas-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-start;
  }

  /* ── CARD ── */
  .card {
    width: 340px;
    background: #FFFFFF;
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.07);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.8) inset,
      0 2px 4px rgba(0,0,0,0.04),
      0 6px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* ── ZONE 1: HEADER + HERO ── */
  .zone-top {
    padding: 18px 20px 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 10px;
    font-weight: 600;
    color: #111827;
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .card-period {
    font-size: 9px;
    font-weight: 400;
    color: #B0B8C4;
  }
  .hero-label {
    font-size: 9px;
    font-weight: 400;
    color: #9CA3AF;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    margin-bottom: 4px;
  }
  .hero-value {
    font-size: 36px;
    font-weight: 700;
    color: #7C3AED;
    line-height: 1;
    letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums;
  }

  /* ── ZONE 2: META STATS ── */
  .zone-meta {
    border-top: 1px solid #F3F4F6;
    background: #F9FAFB;
    padding: 12px 20px;
    display: flex;
    gap: 0;
  }
  .meta-item {
    flex: 1;
  }
  .meta-item + .meta-item {
    padding-left: 16px;
    border-left: 1px solid #EAECEF;
    margin-left: 16px;
  }
  .meta-val {
    font-size: 18px;
    font-weight: 700;
    color: #111827;
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .meta-lbl {
    font-size: 9px;
    font-weight: 400;
    color: #9CA3AF;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 3px;
  }

  /* ── placeholder visuals ── */
  .placeholder-bar {
    width: 100%;
    height: 8px;
    background: rgba(0,0,0,0.06);
    border-radius: 4px;
  }
  .placeholder-chart {
    width: 100%;
    height: 60px;
    background: rgba(0,0,0,0.04);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #C0C5CC;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>

<p class="page-label">Sales Summary Card — Compact for 1280×720</p>

<!-- Canvas context: shows card in proportion to dashboard -->
<div class="canvas-hint">
  <span class="canvas-label">1280 × 720 canvas</span>
  <div class="canvas-content">

    <!-- THE CARD -->
    <div class="card">
      <div class="zone-top">
        <div class="card-header">
          <span class="card-title">Sales Summary</span>
          <span class="card-period">All Periods</span>
        </div>
        <div class="hero-label">Total Premium</div>
        <div class="hero-value">$2,450,000</div>
      </div>

      <div class="zone-meta">
        <div class="meta-item">
          <div class="meta-val">312</div>
          <div class="meta-lbl">Policies</div>
        </div>
        <div class="meta-item">
          <div class="meta-val">189</div>
          <div class="meta-lbl">Clients</div>
        </div>
        <div class="meta-item">
          <div class="meta-val">$7,853</div>
          <div class="meta-lbl">Avg Premium</div>
        </div>
      </div>
    </div>

    <!-- Sibling visuals (greyed out placeholder) -->
    <div style="display:flex; gap:8px; width:100%;">
      <div class="placeholder-chart" style="flex:1;">Chart visual</div>
      <div class="placeholder-chart" style="flex:1;">Chart visual</div>
    </div>
    <div class="placeholder-bar"></div>

  </div>
</div>

<p class="page-label" style="font-size:10px;">Happy with this? I'll write the DAX.</p>

</body>
</html>
